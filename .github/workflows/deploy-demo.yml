name: Deploy demo

on:
  workflow_dispatch:

jobs:
  deploy-demo:
    name: Deploy demo
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deploy in EC2
        env:
          BRANCH: ${{ format('origin/{0}', github.ref_name) }}
          PRIVATE_KEY: ${{ secrets.AWS_DEPLOY_KEY }}
          HOSTNAME : ${{ secrets.AWS_HOSTNAME }}
          USER_NAME : ${{ secrets.AWS_USER }}
        run: |
          echo "$PRIVATE_KEY" > private_key && chmod 600 private_key
          ssh -o StrictHostKeyChecking=no -i private_key ${USER_NAME}@${HOSTNAME} "bash -s" <<EOF
            cd /home/ubuntu/ &&
            [ -d sylius ] || git clone https://github.com/Elastic-Suite/sylius-demo.git sylius &&
            cd /home/ubuntu/sylius &&
            ([ -d packages/GallyPlugin ] || git clone https://github.com/Elastic-Suite/gally-sylius-connector.git packages/GallyPlugin) &&
            [ -d cert ] || cp -r ../certs ./ &&
            docker system prune -af &&
            ([[ $(docker volume ls -q | awk '!/_/' | wc -l) -eq 0 ]] || docker volume rm $(docker volume ls -q | awk '!/_/' | tr '\n' ' ')) &&
            cp compose.override.dist.yml compose.override.yml &&
            docker compose -f compose.yml -f compose.override.yml -f compose.inte.yml down &&
            git fetch --all && git reset --hard && git checkout ${{ env.BRANCH }} &&
            git -C packages/GallyPlugin pull &&
            git -C packages/GallyPlugin checkout ${{ env.BRANCH }} &&
            mv .env.prod .env &&
            cp compose.override.dist.yml compose.override.yml &&
            docker compose -f compose.yml -f compose.override.yml -f compose.inte.yml up -d --build php &&
            docker compose -f compose.yml -f compose.override.yml -f compose.inte.yml run --rm php composer install --no-interaction --no-scripts &&
            docker compose -f compose.yml -f compose.override.yml -f compose.inte.yml run --rm nodejs &&
            docker compose -f compose.yml -f compose.override.yml -f compose.inte.yml exec php bin/console doctrine:migrations:migrate -n &&
            docker compose -f compose.yml -f compose.override.yml -f compose.inte.yml exec php bin/console assets:install &&
            docker compose -f compose.yml -f compose.override.yml -f compose.inte.yml exec php bin/console sylius:install:assets &&
            docker compose -f compose.yml -f compose.override.yml -f compose.inte.yml exec php bin/console sylius:theme:assets:install &&
            docker compose -f compose.yml -f compose.override.yml -f compose.inte.yml exec php bin/console cache:clear &&
            docker compose -f compose.yml -f compose.override.yml -f compose.inte.yml up -d
          EOF
